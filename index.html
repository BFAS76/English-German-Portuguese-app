<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>english-german-portuguese-app</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">

    <!-- Mapeia bare specifiers npm para CDN — necessário para GitHub Pages -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app":       "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js",
            "firebase/auth":      "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        :root { --primary: #00f2fe; --bg: #0f172a; --card: #1e293b; --text-sec: #94a3b8; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            height: 100dvh; /* evita o corte no iOS quando a barra de endereço aparece/desaparece */
            /* Respeita o notch / Dynamic Island / indicador inferior no iPhone */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            overflow: hidden;
        }
        .container { width: 90%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-height: 100%; overflow-y: auto; }
        .category { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        #phrase-display { font-size: 1.4rem; font-weight: bold; margin: 15px 0 5px 0; color: #f8fafc; line-height: 1.3; }
        #translation-display { font-size: 1rem; color: var(--text-sec); font-style: italic; margin-bottom: 20px; min-height: 1.2em; }
        .controls { display: grid; gap: 12px; }
        button {
            border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: 0.2s; -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.96); }
        .btn-listen { background: #334155; color: var(--primary); border: 1px solid var(--primary); }
        .btn-speak { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0f172a; }
        .btn-next { background: transparent; color: var(--text-sec); text-decoration: underline; font-size: 0.85rem; margin-top: 5px; }
        #status { margin-top: 15px; font-size: 0.9rem; color: var(--text-sec); min-height: 3em; }
        .points-box { color: #4ade80; font-weight: bold; margin-bottom: 10px; }

        .selector-row { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 10px; }
        .row-label { color: var(--text-sec); font-size: 0.72rem; min-width: 52px; text-align: right; }
        .btn-lang, .btn-level, .btn-base {
            background: #334155; color: var(--text-sec);
            padding: 7px 14px; border-radius: 20px; font-size: 0.8rem;
            border: 1px solid transparent;
        }
        .btn-lang.active, .btn-level.active, .btn-base.active { color: var(--primary); border-color: var(--primary); }
        .auth-row { text-align: right; margin-bottom: 8px; }
        .btn-auth { background: transparent; color: var(--text-sec); font-size: 0.75rem; padding: 5px 10px; border-radius: 10px; border: 1px solid #334155; }
        .btn-auth:hover { border-color: var(--primary); color: var(--primary); }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .cat-select {
            width: 100%; background: #334155; color: #f8fafc;
            border: 1px solid transparent; border-radius: 20px;
            padding: 8px 14px; font-size: 0.8rem; font-weight: bold;
            text-align: center; cursor: pointer; -webkit-appearance: none; appearance: none;
        }
        .cat-select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        .btn-stats { background: transparent; color: var(--text-sec); text-decoration: underline; font-size: 0.85rem; padding: 6px; }
        .stats-panel {
            margin-top: 10px; padding: 12px; background: #0f172a; border: 1px solid #334155;
            border-radius: 15px; font-size: 0.78rem; text-align: left;
        }
        .stats-panel[hidden] { display: none; }
        .stats-total { color: #4ade80; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .stats-title { color: var(--primary); text-transform: uppercase; font-size: 0.68rem; font-weight: bold; margin: 8px 0 3px; }
        .stats-value { color: var(--text-sec); line-height: 1.5; word-break: break-word; }

        /* Dica de instalação no iOS (o Safari não mostra aviso automático). */
        .ios-install {
            position: fixed; left: 12px; right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            background: var(--card); color: #f8fafc;
            border: 1px solid var(--primary); border-radius: 16px;
            padding: 14px 16px; font-size: 0.85rem; line-height: 1.4;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 50;
            display: flex; align-items: center; gap: 10px; text-align: left;
        }
        .ios-install[hidden] { display: none; }
        #ios-install-text { flex: 1; }
        .ios-install b { color: var(--primary); }
        .ios-install-close {
            background: transparent; color: var(--text-sec); border: none;
            font-size: 1.1rem; padding: 4px 8px; cursor: pointer; line-height: 1;
        }
    </style>
</head>
<body>

<main class="container">
    <h1 class="sr-only">English-German-Portuguese App</h1>
    <div class="auth-row">
        <button id="auth-btn" class="btn-auth" aria-label="Sincronizar progresso" title="Login para sincronizar entre dispositivos">☁️ Sync</button>
    </div>
    <div class="selector-row" role="group" aria-label="A minha língua (a dica aparece nesta)">
        <span class="row-label">Falo</span>
        <button class="btn-base" data-base="en" aria-label="Inglês">🇬🇧</button>
        <button class="btn-base" data-base="de" aria-label="Alemão">🇩🇪</button>
        <button class="btn-base active" data-base="pt" aria-label="Português">🇵🇹</button>
    </div>
    <div class="selector-row" role="group" aria-label="Língua que estou a aprender">
        <span class="row-label">Aprendo</span>
        <button class="btn-lang active" data-lang="en" aria-label="Inglês">🇬🇧</button>
        <button class="btn-lang" data-lang="de" aria-label="Alemão">🇩🇪</button>
        <button class="btn-lang" data-lang="pt" aria-label="Português">🇵🇹</button>
    </div>
    <div class="selector-row" role="group" aria-label="Nível CEFR">
        <button class="btn-level active" data-level="A1">A1</button>
        <button class="btn-level" data-level="A2">A2</button>
        <button class="btn-level" data-level="B1">B1</button>
    </div>
    <div class="selector-row">
        <select id="cat-select" class="cat-select" aria-label="Categoria"></select>
    </div>

    <div class="points-box">XP: <span id="points">0</span></div>
    <div id="cat-display" class="category">Tap to start</div>
    <div id="phrase-display">Ready?</div>
    <div id="translation-display" lang="pt">Clique para começar</div>

    <div class="controls">
        <button class="btn-listen" aria-label="Ouvir pronúncia nativa">🔊 Hear Native</button>
        <button id="mic-btn" class="btn-speak" aria-label="Falar agora">🎤 Speak Now</button>
        <button class="btn-next" aria-label="Saltar para a frase seguinte">Skip / Next ➔</button>
    </div>
    <div id="status" role="status" aria-live="polite">Tip: Click "Hear Native" to learn the sound first!</div>

    <button id="stats-btn" class="btn-stats" aria-expanded="false" aria-controls="stats-panel">📊 Progress</button>
    <div id="stats-panel" class="stats-panel" hidden>
        <div class="stats-total">✅ <span id="stats-total">0</span> correct</div>
        <div class="stats-title">By level</div>
        <div id="stats-levels" class="stats-value"></div>
        <div class="stats-title">By category</div>
        <div id="stats-cats" class="stats-value"></div>
    </div>
</main>

<div id="ios-install" class="ios-install" role="dialog" aria-label="Como instalar a app no iPhone ou iPad" hidden>
    <span id="ios-install-text"></span>
    <button id="ios-install-close" class="ios-install-close" aria-label="Fechar">✕</button>
</div>

<script type="module">
    import { initAudio, playVoice, startRecognition, nextPhrase, switchLanguage, switchBase, switchLevel, switchCategory, loadProgress, loadFromCloud, updateStatsUI, CATEGORIES, ALL_CATEGORIES, cloud } from './app.js';
    import { initFirebase, onAuthChange, signIn, signOutUser, getCurrentUser, cloudSave, cloudLoad } from './firebase.js';

    // Preenche o seletor de categorias a partir da biblioteca (All + categorias).
    const catSelect = document.getElementById('cat-select');
    for (const c of [ALL_CATEGORIES, ...CATEGORIES]) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c === ALL_CATEGORIES ? '🏷️ All categories' : c;
        catSelect.appendChild(opt);
    }
    catSelect.addEventListener('change', () => switchCategory(catSelect.value));

    // Painel de estatísticas (mostrar/esconder).
    const statsBtn = document.getElementById('stats-btn');
    const statsPanel = document.getElementById('stats-panel');
    statsBtn.addEventListener('click', () => {
        const show = statsPanel.hasAttribute('hidden');
        statsPanel.toggleAttribute('hidden', !show);
        statsBtn.setAttribute('aria-expanded', String(show));
        if (show) updateStatsUI();
    });

    // ----------------------------------------------------------------
    // Configuração Firebase — preenche com os teus valores
    // Deixa apiKey como 'YOUR_API_KEY' para correr sem Firebase
    // ----------------------------------------------------------------
    const FIREBASE_CONFIG = {
        apiKey:            'YOUR_API_KEY',
        authDomain:        'YOUR_PROJECT.firebaseapp.com',
        projectId:         'YOUR_PROJECT_ID',
        storageBucket:     'YOUR_PROJECT.appspot.com',
        messagingSenderId: 'YOUR_SENDER_ID',
        appId:             'YOUR_APP_ID',
    };

    // Liga as funções cloud ao app.js.
    cloud.save = cloudSave;
    cloud.load = cloudLoad;

    // Carrega o progresso local primeiro — não depende do Firebase e garante
    // que a app funciona offline mesmo sem o SDK carregado.
    loadProgress();

    // initFirebase é assíncrono: só carrega o SDK (do CDN) se houver config real.
    // Em modo local, nada é obtido da rede, por isso a app arranca offline.
    await initFirebase(FIREBASE_CONFIG);

    onAuthChange(async (user) => {
        const btn = document.getElementById('auth-btn');
        if (user) {
            btn.textContent = `✓ ${user.displayName?.split(' ')[0] ?? 'Sync'}`;
            btn.title = `Sessão: ${user.email} — clica para sair`;
            await loadFromCloud();
        } else {
            btn.textContent = '☁️ Sync';
            btn.title = 'Login com Google para sincronizar entre dispositivos';
        }
    });

    document.getElementById('auth-btn').addEventListener('click', async () => {
        if (getCurrentUser()) {
            await signOutUser();
        } else {
            await signIn().catch(() => {});
        }
    });

    // Controlos da app
    document.body.addEventListener('click', initAudio);
    document.querySelector('.btn-listen').addEventListener('click', playVoice);
    document.getElementById('mic-btn').addEventListener('click', startRecognition);
    document.querySelector('.btn-next').addEventListener('click', nextPhrase);

    document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.addEventListener('click', () => switchLanguage(btn.dataset.lang));
    });
    document.querySelectorAll('[data-base]').forEach(btn => {
        btn.addEventListener('click', () => switchBase(btn.dataset.base));
    });
    document.querySelectorAll('[data-level]').forEach(btn => {
        btn.addEventListener('click', () => switchLevel(btn.dataset.level));
    });

    // Service worker: torna a app instalável e disponível offline (PWA).
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }

    // Dica de instalação no iOS: ao contrário do Android, o Safari não dispara
    // o aviso automático de instalação. A única forma é Partilhar → "Adicionar
    // ao ecrã principal", e só funciona no Safari (não em Chrome/Firefox iOS nem
    // nos navegadores embutidos de apps como Instagram/Facebook). Explicamos isso.
    (function iosInstallHint() {
        const ua = window.navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+
        if (!isIOS) return;

        const isStandalone = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;
        if (isStandalone) return; // já está instalada

        let dismissed = false;
        try { dismissed = localStorage.getItem('iosInstallDismissed') === '1'; } catch {}
        if (dismissed) return;

        const otherBrowser = /crios|fxios|edgios|opt\//i.test(ua); // Chrome/Firefox/Edge/Opera iOS
        const text = document.getElementById('ios-install-text');
        text.innerHTML = otherBrowser
            ? '📲 Para instalar no iPhone/iPad, abre este site no <b>Safari</b> e usa <b>Partilhar ⬆️ → "Adicionar ao ecrã principal"</b>.'
            : '📲 Para instalar: toca em <b>Partilhar ⬆️</b> e depois em <b>"Adicionar ao ecrã principal"</b>.';

        const banner = document.getElementById('ios-install');
        banner.hidden = false;
        document.getElementById('ios-install-close').addEventListener('click', () => {
            banner.hidden = true;
            try { localStorage.setItem('iosInstallDismissed', '1'); } catch {}
        });
    })();
</script>
</body>
</html>
